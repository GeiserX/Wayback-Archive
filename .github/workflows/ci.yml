name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

# A new push to the same branch or pull request makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov authenticates the upload with a GitHub OIDC token.
      id-token: write
    strategy:
      matrix:
        # 3.9 reached end-of-life in Oct 2025 and current deps (requests >= 2.34)
        # no longer publish wheels for it, which broke every dependency bump.
        # pyproject.toml lists the same versions as classifiers; test_packaging.py
        # fails when the two disagree.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # No job here pushes; a persisted token is readable by every pip install.
        persist-credentials: false

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: config/requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements.txt
        pip install -r config/requirements-dev.txt

    # ruff replaces flake8 and black: the rules live in pyproject.toml, and a
    # file that is not formatted fails the build.
    - name: Lint and check formatting with ruff
      run: |
        ruff check wayback_archive tests
        ruff format --check wayback_archive tests

    # The mypy settings live in pyproject.toml.
    - name: Type check with mypy
      run: mypy wayback_archive

    # Coverage sits above 90%; 85 is a floor that catches a real drop without
    # flapping on small changes.
    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=wayback_archive --cov-report=xml --cov-report=html --cov-fail-under=85

    # Run from outside the checkout and assert where the import came from:
    # python puts the working directory ahead of site-packages, so importing
    # from the repo root would pass on an empty wheel.
    - name: Build and install the wheel
      run: |
        pip install build
        python -m build
        python -m venv /tmp/wheel-check
        /tmp/wheel-check/bin/pip install dist/*.whl
        cd /tmp
        /tmp/wheel-check/bin/python -c "import os, wayback_archive, wayback_archive.downloader; p = os.path.dirname(wayback_archive.__file__); assert 'site-packages' in p, p; print('wheel ok', wayback_archive.__version__, p)"
        # The console script is installed: with no WAYBACK_URL it exits 1 naming it.
        if /tmp/wheel-check/bin/wayback-archive > cli.out 2>&1; then cat cli.out; exit 1; fi
        grep WAYBACK_URL cli.out

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        use_oidc: true
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # Paths, line endings and file names behave differently off Linux;
  # one Python version is enough to catch that.
  test-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.13
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: config/requirements*.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r config/requirements.txt
        python -m pip install -r config/requirements-dev.txt

    - name: Lint and check formatting with ruff
      run: |
        ruff check wayback_archive tests
        ruff format --check wayback_archive tests

    - name: Test with pytest
      run: python -m pytest tests/ -v

  # Builds the image the release publishes, without pushing it, and checks the
  # entrypoint is the CLI: with no WAYBACK_URL it exits 1 naming it.
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Build the image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        push: false
        tags: wayback-archive:ci

    - name: Run the image without WAYBACK_URL
      run: |
        set +e
        docker run --rm wayback-archive:ci > cli.out 2>&1
        status=$?
        set -e
        cat cli.out
        if [ "$status" -ne 1 ]; then echo "::error::expected exit 1, got $status"; exit 1; fi
        grep WAYBACK_URL cli.out
