name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9 reached end-of-life in Oct 2025 and current deps (requests >= 2.34)
        # no longer publish wheels for it, which broke every dependency bump.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('config/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r config/requirements.txt
        pip install -r config/requirements-dev.txt

    # ruff replaces flake8 and black: the rules live in pyproject.toml, and a
    # file that is not formatted fails the build. mypy comes back when the
    # code passes it.
    - name: Lint and check formatting with ruff
      run: |
        ruff check wayback_archive tests
        ruff format --check wayback_archive tests

    - name: Test with pytest
      run: |
        pytest tests/ -v --cov=wayback_archive --cov-report=xml --cov-report=html

    # Run from outside the checkout and assert where the import came from:
    # python puts the working directory ahead of site-packages, so importing
    # from the repo root would pass on an empty wheel.
    - name: Build and install the wheel
      run: |
        pip install build
        python -m build
        python -m venv /tmp/wheel-check
        /tmp/wheel-check/bin/pip install dist/*.whl
        cd /tmp
        /tmp/wheel-check/bin/python -c "import os, wayback_archive, wayback_archive.downloader; p = os.path.dirname(wayback_archive.__file__); assert 'site-packages' in p, p; print('wheel ok', wayback_archive.__version__, p)"
        # The console script is installed: with no WAYBACK_URL it exits 1 naming it.
        if /tmp/wheel-check/bin/wayback-archive > cli.out 2>&1; then cat cli.out; exit 1; fi
        grep WAYBACK_URL cli.out

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false


