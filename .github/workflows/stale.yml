name: Close stale issues
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

# Pull requests are never marked stale (days-before-pr-* = -1), so issues
# are the only thing this job writes.
permissions:
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity for 90 days. It will be closed in 30 days if no further activity occurs.'
          close-issue-message: 'This issue was closed because it has been stale for 30 days with no activity.'
          days-before-issue-stale: 90
          days-before-issue-close: 30
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,enhancement,bug'
          days-before-pr-stale: -1
          days-before-pr-close: -1
