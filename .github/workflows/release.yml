name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distributions
      run: twine check dist/*

    - name: Verify the sdist installs
      run: |
        python -m venv /tmp/sdist-check
        /tmp/sdist-check/bin/pip install dist/*.tar.gz
        /tmp/sdist-check/bin/python -c "import wayback_archive; print(wayback_archive.__version__)"

    - name: Upload built distributions
      uses: actions/upload-artifact@v7
      with:
        name: wayback-archive-dist
        path: dist/*
        if-no-files-found: error

    - name: Publish to PyPI
      if: ${{ env.PYPI_TOKEN != '' }}
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*

    - name: Skip PyPI publish
      if: ${{ env.PYPI_TOKEN == '' }}
      run: echo "::warning::PYPI_API_TOKEN is not set — built but not published to PyPI."
