name: Release

on:
  # `created` never fires for a draft; `published` covers a direct release
  # and a draft that is published later.
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"

    # A tag that disagrees with __version__ would build and upload a version
    # nobody asked for. The package root has no imports, so this needs no deps.
    - name: Check the tag matches the package version
      if: github.event_name == 'release'
      run: |
        version=$(python -c "import wayback_archive; print(wayback_archive.__version__)")
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match wayback_archive.__version__ $version"
          exit 1
        fi

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check distributions
      run: twine check dist/*

    # Run from outside the checkout and assert where the import came from:
    # python puts the working directory ahead of site-packages, so importing
    # from the repo root would pass on a completely empty sdist.
    - name: Verify the sdist installs
      run: |
        python -m venv /tmp/sdist-check
        /tmp/sdist-check/bin/pip install dist/*.tar.gz
        cd /tmp && /tmp/sdist-check/bin/python -c "import os, wayback_archive, wayback_archive.downloader; p = os.path.dirname(wayback_archive.__file__); assert 'site-packages' in p, p; print('sdist ok', wayback_archive.__version__, p)"

    - name: Upload built distributions
      uses: actions/upload-artifact@v7
      with:
        name: wayback-archive-dist
        path: dist/*
        if-no-files-found: error

    # The token lives in this step only: a job-level env would hand it to
    # every step above, including pip installs and the build backend.
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        if [ -z "$TWINE_PASSWORD" ]; then
          echo "::warning::PYPI_API_TOKEN is not set — built but not published to PyPI."
          exit 0
        fi
        twine upload dist/*
